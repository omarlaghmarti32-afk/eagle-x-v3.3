name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx
          python -c "import sklearn, fastapi, cryptography, psutil; print('imports-ok')"

      - name: Run tests
        env:
          EAGLE_DATA_DIR: ${{ runner.temp }}/eagle-data
          EAGLE_LOG_DIR: ${{ runner.temp }}/eagle-logs
          EAGLE_API_TOKEN: test-token
          EAGLE_LIVE_MONITOR: "0"
          EAGLE_HEALTH_INTERNAL: "0"
        run: |
          mkdir -p "$EAGLE_DATA_DIR" "$EAGLE_LOG_DIR"
          python -m pytest -q --tb=short -x
