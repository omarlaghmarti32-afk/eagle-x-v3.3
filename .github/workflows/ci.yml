name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx

      - name: Run tests
        env:
          EAGLE_DATA_DIR: ${{ runner.temp }}/eagle-data
          EAGLE_LOG_DIR: ${{ runner.temp }}/eagle-logs
          EAGLE_API_TOKEN: test-token
          EAGLE_LIVE_MONITOR: "0"
          EAGLE_HEALTH_INTERNAL: "0"
        run: |
          mkdir -p "$EAGLE_DATA_DIR" "$EAGLE_LOG_DIR"
          python -m pytest -q --tb=short
