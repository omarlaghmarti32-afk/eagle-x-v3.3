name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          EAGLE_DATA_DIR: ${{ runner.temp }}/eagle-data
          EAGLE_LOG_DIR: ${{ runner.temp }}/eagle-logs
          EAGLE_API_TOKEN: test-token
        run: |
          mkdir -p "$EAGLE_DATA_DIR" "$EAGLE_LOG_DIR"
          pytest -q
