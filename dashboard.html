<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAGLE-X v3.3 — لوحة التحكم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0a192f; color: #e6f1ff; }
        .seal-gold { color: #d4af37; }
        .bg-card { background-color: #112240; border: 1px solid rgba(212, 175, 55, 0.2); }
        .glow-gold { box-shadow: 0 0 20px rgba(212, 175, 55, 0.15); }
    </style>
</head>
<body class="min-h-screen p-6">
    <div class="max-w-7xl mx-auto space-y-6">
        <header class="flex justify-between items-center bg-card p-6 rounded-2xl glow-gold">
            <div class="flex items-center space-x-4 space-x-reverse">
                <div class="text-4xl">🦅</div>
                <div>
                    <h1 class="text-3xl font-black seal-gold">EAGLE-X v3.3</h1>
                    <p class="text-sm text-gray-400">نظام تشغيلي حقيقي • مراقبة المضيف • AES-256-GCM + Ed25519</p>
                </div>
            </div>
            <div class="flex items-center space-x-3 space-x-reverse">
                <span class="inline-block w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
                <span id="status-text" class="text-sm font-bold text-green-400">جاري الاتصال...</span>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <div class="bg-card p-6 rounded-2xl">
                <p class="text-sm text-gray-400 mb-2">العينات المفحوصة</p>
                <h3 id="stat-packets" class="text-3xl font-black seal-gold">0</h3>
            </div>
            <div class="bg-card p-6 rounded-2xl">
                <p class="text-sm text-gray-400 mb-2">التهديدات</p>
                <h3 id="stat-threats" class="text-3xl font-black text-red-400">0</h3>
            </div>
            <div class="bg-card p-6 rounded-2xl">
                <p class="text-sm text-gray-400 mb-2">CPU / RAM</p>
                <h3 id="stat-host" class="text-xl font-bold text-green-400">—</h3>
            </div>
            <div class="bg-card p-6 rounded-2xl">
                <p class="text-sm text-gray-400 mb-2">التشفير النشط</p>
                <h3 class="text-lg font-bold seal-gold">AES-256-GCM</h3>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 bg-card p-6 rounded-2xl">
                <h3 class="text-xl font-bold mb-4 seal-gold">سجل التهديدات</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-right text-sm">
                        <thead>
                            <tr class="border-b border-gray-700 text-gray-400">
                                <th class="pb-3">الوقت</th>
                                <th class="pb-3">النوع</th>
                                <th class="pb-3">الثقة</th>
                                <th class="pb-3">الخطورة</th>
                            </tr>
                        </thead>
                        <tbody id="threat-table-body" class="divide-y divide-gray-800">
                            <tr><td colspan="4" class="py-4 text-center text-gray-500">لا توجد تهديدات بعد</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="bg-card p-6 rounded-2xl space-y-4">
                <h3 class="text-xl font-bold seal-gold">التحكم</h3>
                <input id="api-token" type="password" placeholder="Bearer token" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white" value="eagle-x-dev-token-change-me">
                <button onclick="triggerScan()" class="w-full bg-yellow-600 hover:bg-yellow-500 text-black font-bold py-3 rounded-xl">فحص فوري</button>
                <button onclick="triggerHeal()" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-xl">اختبار الشفاء</button>
                <p class="text-xs text-gray-500">الافتراضي للتطوير فقط — غيّر EAGLE_API_TOKEN في الإنتاج.</p>
            </div>
        </div>
    </div>

    <script>
        function authHeaders() {
            const t = document.getElementById('api-token').value.trim();
            return t ? { 'Authorization': 'Bearer ' + t, 'Content-Type': 'application/json' } : { 'Content-Type': 'application/json' };
        }

        async function fetchStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                document.getElementById('stat-packets').innerText = (data.packets_scanned || 0).toLocaleString();
                document.getElementById('stat-threats').innerText = data.threats_detected || 0;
                if (data.host) {
                    document.getElementById('stat-host').innerText =
                        Math.round(data.host.cpu_percent) + '% / ' + Math.round(data.host.mem_percent) + '%';
                }
                document.getElementById('status-text').innerText = 'النظام يعمل';
            } catch (e) {
                document.getElementById('status-text').innerText = 'تعذر الاتصال';
            }
        }

        async function fetchThreats() {
            try {
                const res = await fetch('/api/threats');
                const data = await res.json();
                const tbody = document.getElementById('threat-table-body');
                if (data.threats && data.threats.length) {
                    tbody.innerHTML = data.threats.map(t => `
                        <tr class="hover:bg-gray-800/50">
                            <td class="py-3">${new Date(t.timestamp).toLocaleTimeString()}</td>
                            <td class="py-3 text-red-400">${t.type}</td>
                            <td class="py-3">${((t.confidence || 0) * 100).toFixed(1)}%</td>
                            <td class="py-3">${t.severity || '-'}</td>
                        </tr>`).join('');
                }
            } catch (e) {}
        }

        async function triggerScan() {
            // High anomaly-like vector for demo
            const features = [90, 92, 2500000, 3000000, 420, 280, 75, 0.9];
            const res = await fetch('/api/detect', {
                method: 'POST',
                headers: authHeaders(),
                body: JSON.stringify({ features, indicator: '10.0.0.66' })
            });
            const data = await res.json();
            alert(data.analysis && data.analysis.threat_detected ? 'تم اكتشاف تهديد' : 'آمن / تحقق من التوكن');
            fetchStats(); fetchThreats();
        }

        async function triggerHeal() {
            const res = await fetch('/api/heal', {
                method: 'POST',
                headers: authHeaders(),
                body: JSON.stringify({ threat_type: 'MANUAL_TEST', indicator: '10.0.0.66' })
            });
            const data = await res.json();
            alert('نتيجة الشفاء: ' + JSON.stringify(data.actions || data));
        }

        setInterval(() => { fetchStats(); fetchThreats(); }, 3000);
        fetchStats(); fetchThreats();
    </script>
</body>
</html>
