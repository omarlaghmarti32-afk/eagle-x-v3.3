services:
  eagle-x:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENABLE_PQC: "${ENABLE_PQC:-1}"
    image: eagle-x:3.3-pqc
    container_name: eagle-x-v33
    expose:
      - "8080"
    environment:
      EAGLE_MODE: production
      LOG_LEVEL: INFO
      EAGLE_LOG_DIR: /var/log/eagle-x
      EAGLE_DATA_DIR: /app/data
      EAGLE_API_TOKEN: ${EAGLE_API_TOKEN:-eagle-x-dev-token-change-me}
      EAGLE_AI_SENSITIVITY: "0.75"
      EAGLE_MONITOR_INTERVAL: "2.0"
      EAGLE_LIVE_MONITOR: "1"
      EAGLE_HEALTH_INTERNAL: "1"
      EAGLE_HEALTH_INTERNAL_INTERVAL: "60"
      EAGLE_PCAP: ${EAGLE_PCAP:-0}
    volumes:
      - eagle_data:/app/data
      - eagle_logs:/var/log/eagle-x
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/ready')"]
      interval: 20s
      timeout: 8s
      retries: 3
      start_period: 40s

  health-monitor:
    image: eagle-x:3.3-pqc
    container_name: eagle-x-health
    depends_on:
      eagle-x:
        condition: service_healthy
    environment:
      EAGLE_HEALTH_URL: http://eagle-x:8080/api/health/deep
      EAGLE_HEALTH_INTERVAL: ${EAGLE_HEALTH_INTERVAL:-30}
      EAGLE_HEALTH_TIMEOUT: "8"
      EAGLE_HEALTH_FAIL_THRESHOLD: "3"
      EAGLE_HEALTH_LOG: /var/log/eagle-x/health-monitor.log
      EAGLE_HEALTH_WEBHOOK: ${EAGLE_HEALTH_WEBHOOK:-}
    volumes:
      - eagle_logs:/var/log/eagle-x
    command: ["python", "scripts/health_monitor.py"]
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    container_name: eagle-x-proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      EAGLE_DOMAIN: ${EAGLE_DOMAIN:-localhost}
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@localhost}
    volumes:
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      eagle-x:
        condition: service_healthy
    restart: unless-stopped

volumes:
  eagle_data:
  eagle_logs:
  caddy_data:
  caddy_config:
