services:
  eagle-x:
    build: .
    container_name: eagle-x-v33
    expose:
      - "8080"
    environment:
      EAGLE_MODE: production
      LOG_LEVEL: INFO
      EAGLE_LOG_DIR: /var/log/eagle-x
      EAGLE_DATA_DIR: /app/data
      EAGLE_API_TOKEN: ${EAGLE_API_TOKEN:-eagle-x-dev-token-change-me}
      EAGLE_AI_SENSITIVITY: "0.75"
      EAGLE_MONITOR_INTERVAL: "2.0"
      EAGLE_LIVE_MONITOR: "1"
      EAGLE_PCAP: ${EAGLE_PCAP:-0}
    volumes:
      - eagle_data:/app/data
      - eagle_logs:/var/log/eagle-x
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    # Uncomment for packet capture (needs NET_RAW / host network):
    # network_mode: host
    # cap_add: [NET_RAW, NET_ADMIN]

  caddy:
    image: caddy:2.8-alpine
    container_name: eagle-x-proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      EAGLE_DOMAIN: ${EAGLE_DOMAIN:-localhost}
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - eagle-x
    restart: unless-stopped

volumes:
  eagle_data:
  eagle_logs:
  caddy_data:
  caddy_config:
